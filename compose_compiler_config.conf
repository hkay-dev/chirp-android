// Compose compiler stability configuration.
//
// Only deeply immutable types belong here: a whitelisted type is treated as stable even when it
// is not, which makes composables skip updates they should have rendered.
//
// Wired for every module that applies the Kotlin Compose plugin (see the root build.gradle.kts).

// Sealed recording state: every subclass is a data class of vals over primitives, enums, String
// and UUID. It lives in core-contracts, which does not apply the Compose plugin and therefore
// cannot be inferred stable — that alone stopped every recording row and the recording timer from
// ever skipping.
// Caveat: RecordingState.Error carries a Throwable, whose identity is fixed at construction here
// (it is only ever read for its message); nothing mutates a state instance after it is emitted.
dev.chirpboard.app.core.recording.RecordingState

// Immutable value carrier used directly as a composable parameter.
java.util.UUID

// Deliberately NOT listed: dev.chirpboard.app.core.recording.WaveformBuffer, which is a mutable
// ring buffer written from the capture thread. Whitelisting it would silently freeze waveforms.
